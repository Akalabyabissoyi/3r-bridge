name: Bug report
description: Something in the app or code is not working
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
  - type: input
    id: env
    attributes: { label: Version and browser or Python version }
