name: Suggest an evidence or score update
description: A model score, status or reference looks wrong or out of date
labels: ["evidence"]
body:
  - type: dropdown
    id: model
    attributes:
      label: Model
      options: [In silico, Human 2D cells, 3D liver spheroids, Intestinal barrier, Organoids, Organ-on-chip, Drosophila, C. elegans, Zebrafish larvae, Ex vivo tissue, Rodents, Other / new model]
    validations: { required: true }
  - type: input
    id: area
    attributes: { label: Research area (or requirement) affected }
    validations: { required: true }
  - type: input
    id: change
    attributes:
      label: Proposed change
      description: "For example: hepatotox 2 -> 3"
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paper, test guideline, validation status or regulatory document (DOI or URL).
    validations: { required: true }
  - type: input
    id: expertise
    attributes:
      label: Your relevant expertise (optional)
