[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3r-bridge"
version = "0.2.0"
description = "Choose, preserve and justify the least sentient model that can answer a research question (Replacement, Reduction, Refinement)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akalabya Bissoyi", email = "bissoyi.akalabya@gmail.com" }]
keywords = ["3Rs", "animal replacement", "NAMs", "research ethics", "ASPA", "biobanking", "streamlit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "python-docx>=1.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.6", "streamlit>=1.40", "plotly>=5.20"]

[project.scripts]
3r-bridge = "bridge.cli:main"

[project.urls]
Homepage = "https://github.com/Akalabyabissoyi/3r-bridge"
Issues = "https://github.com/Akalabyabissoyi/3r-bridge/issues"

[tool.setuptools]
packages = ["bridge"]

[tool.setuptools.package-data]
bridge = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E731", "E702", "B905"]
